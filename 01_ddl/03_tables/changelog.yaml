      id: ddl-tables-006
      author: FernandaRobayo
      labels: "HU-COM-002,ddl,03_tables"
      comment: "PROPOSED associated_establishment_image: the promotional image in a table of its own, one per association, 800 KB at most and PNG, JPEG or WebP only (ADR-005 E6, plan.md D-02)."
