databaseChangeLog:
  - changeSet:
      id: ddl-tables-001
      author: FernandaRobayo
      labels: "HU-COM-001,ddl,03_tables"
      comment: "idempotency_key: one key table for the whole domain, unique per tenant and key, 8 to 128 characters (norm 5.3.8)."
      changes:
        - sqlFile:
            path: 001_create_idempotency_key.sql
            relativeToChangelogFile: true
            splitStatements: false
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/01_ddl/03_tables/001_create_idempotency_key.rollback.sql
            relativeToChangelogFile: true
            splitStatements: false
  - changeSet:
      id: ddl-tables-002
      author: FernandaRobayo
      labels: "HU-COM-001,ddl,03_tables"
      comment: "outbox_event: events written with the change they announce, read by the relay through the API (norm 5.3.11)."
      changes:
        - sqlFile:
            path: 002_create_outbox_event.sql
            relativeToChangelogFile: true
            splitStatements: false
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/01_ddl/03_tables/002_create_outbox_event.rollback.sql
            relativeToChangelogFile: true
            splitStatements: false
  - changeSet:
      id: ddl-tables-003
      author: FernandaRobayo
      labels: "HU-COM-001,ddl,03_tables"
      comment: "catalog_service: the services a tenant offers, with closed value sets as CHECKs and no defaults (plan.md DD-8, DD-16)."
      changes:
        - sqlFile:
            path: 003_create_catalog_service.sql
            relativeToChangelogFile: true
            splitStatements: false
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/01_ddl/03_tables/003_create_catalog_service.rollback.sql
            relativeToChangelogFile: true
            splitStatements: false
  - changeSet:
      id: ddl-tables-004
      author: FernandaRobayo
      labels: "HU-COM-001,ddl,03_tables"
      comment: "salida_capacity: the capacity and held seats of a departure, one row per tenant and departure (plan.md DD-19; name and columns proposed in 06-data)."
      changes:
        - sqlFile:
            path: 004_create_salida_capacity.sql
            relativeToChangelogFile: true
            splitStatements: false
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/01_ddl/03_tables/004_create_salida_capacity.rollback.sql
            relativeToChangelogFile: true
            splitStatements: false
  - changeSet:
      id: ddl-tables-005
      author: FernandaRobayo
      labels: "HU-COM-002,ddl,03_tables"
      comment: "associated_establishment: the hotels and restaurants a tenant associates, closed value sets as CHECKs, no defaults and no columns of rooms, dishes, menus, seats, rates or availability (HU-COM-002, RN-01, RN-02)."
      changes:
        - sqlFile:
            path: 005_create_associated_establishment.sql
            relativeToChangelogFile: true
            splitStatements: false
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/01_ddl/03_tables/005_create_associated_establishment.rollback.sql
            relativeToChangelogFile: true
            splitStatements: false
  - changeSet:
      id: ddl-tables-006
      author: FernandaRobayo
      labels: "HU-COM-002,ddl,03_tables"
      comment: "PROPOSED associated_establishment_image: the promotional image in a table of its own, one per association, 800 KB at most and PNG, JPEG or WebP only (ADR-005 E6, plan.md D-02)."
      changes:
        - sqlFile:
            path: 006_create_associated_establishment_image.sql
            relativeToChangelogFile: true
            splitStatements: false
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/01_ddl/03_tables/006_create_associated_establishment_image.rollback.sql
            relativeToChangelogFile: true
            splitStatements: false
  - changeSet:
      id: ddl-tables-007
      author: FernandaRobayo
      labels: "HU-COM-003,discount-table,ddl,03_tables"
      comment: "DP-03: discount rule values in integer basis points or cents; open decisions stay absent."
      changes:
        - sqlFile:
            path: 007_create_discount_rule.sql
            relativeToChangelogFile: true
            splitStatements: false
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/01_ddl/03_tables/007_create_discount_rule.rollback.sql
            relativeToChangelogFile: true
            splitStatements: false
  - changeSet:
      id: ddl-tables-008
      author: FernandaRobayo
      labels: "HU-COM-005,customer-tables,ddl,03_tables"
      comment: "customer: identity, tenant, full name and creation time only; columns of open decisions stay absent (HU-COM-005 plan D-02, D-07)."
      changes:
        - sqlFile:
            path: 008_create_customer.sql
            relativeToChangelogFile: true
            splitStatements: false
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/01_ddl/03_tables/008_create_customer.rollback.sql
