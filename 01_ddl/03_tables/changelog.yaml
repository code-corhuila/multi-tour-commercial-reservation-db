      id: ddl-tables-004
      author: FernandaRobayo
      labels: "HU-COM-001,ddl,03_tables"
      comment: "salida_capacity: the capacity and held seats of a departure, one row per tenant and departure (plan.md DD-19; name and columns proposed in 06-data)."
      changes:
        - sqlFile:
            path: 004_create_salida_capacity.sql
