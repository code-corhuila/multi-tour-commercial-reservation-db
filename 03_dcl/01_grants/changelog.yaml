databaseChangeLog:
  - changeSet:
      id: dcl-grants-001
      author: FernandaRobayo
      labels: "HU-COM-001,dcl,grants"
      comment: "Reader: usage of the schema and SELECT, on the tables that exist and on the ones created later."
      changes:
        - sqlFile:
            path: 001_grant_reader.sql
            relativeToChangelogFile: true
            splitStatements: false
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/03_dcl/01_grants/001_grant_reader.rollback.sql
            relativeToChangelogFile: true
            splitStatements: false
  - changeSet:
      id: dcl-grants-002
      author: FernandaRobayo
      labels: "HU-COM-001,dcl,grants"
      comment: "Writer: SELECT, INSERT and UPDATE, no DELETE by default (RN-06), on the tables that exist and on the ones created later."
      changes:
        - sqlFile:
            path: 002_grant_writer.sql
            relativeToChangelogFile: true
            splitStatements: false
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/03_dcl/01_grants/002_grant_writer.rollback.sql
            relativeToChangelogFile: true
            splitStatements: false
  - changeSet:
      id: dcl-grants-003
      author: FernandaRobayo
      labels: "HU-COM-001,dcl,grants"
      comment: "The application user, created by the infrastructure, receives the writer (Annex J.7)."
      changes:
        - sqlFile:
            path: 003_grant_writer_to_application_user.sql
            relativeToChangelogFile: true
            splitStatements: false
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/03_dcl/01_grants/003_grant_writer_to_application_user.rollback.sql
            relativeToChangelogFile: true
            splitStatements: false
  - changeSet:
      id: dcl-grants-004
      author: FernandaRobayo
      labels: "HU-COM-001,dcl,grants"
      comment: "Writer: DELETE on idempotency_key and outbox_event only, for the daily purge of ADR-004 D10 point 6."
      changes:
        - sqlFile:
            path: 004_grant_delete_on_technical_tables.sql
            relativeToChangelogFile: true
            splitStatements: false
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/03_dcl/01_grants/004_grant_delete_on_technical_tables.rollback.sql
            relativeToChangelogFile: true
            splitStatements: false
  - changeSet:
      id: dcl-grants-005
      author: FernandaRobayo
      labels: "HU-COM-005,customer-sensitive,dcl,grants"
      comment: "Reader loses SELECT on the two sensitive tables, after they exist (DP-D5-7, AC-D5.7)."
      changes:
        - sqlFile:
            path: 005_revoke_select_on_sensitive_tables.sql
            relativeToChangelogFile: true
            splitStatements: false
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/03_dcl/01_grants/005_revoke_select_on_sensitive_tables.rollback.sql
            relativeToChangelogFile: true
            splitStatements: false
  - changeSet:
      id: dcl-grants-006
      author: FernandaRobayo
      labels: "HU-COM-004,additional-discount-immutable,dcl,grants"
      comment: "The writer loses UPDATE on reservation_additional_discount: a stored additional discount is immutable (AC-D4.9)."
      changes:
        - sqlFile:
            path: 006_revoke_update_on_reservation_additional_discount.sql
            relativeToChangelogFile: true
            splitStatements: false
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/03_dcl/01_grants/006_revoke_update_on_reservation_additional_discount.rollback.sql
            relativeToChangelogFile: true
            splitStatements: false
